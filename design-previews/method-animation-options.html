<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MVMNT CULTR — Heading animations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#eceeed; color:#080808; font:14px/1.6 Montserrat,Arial,sans-serif; }
    .review { max-width:1360px; margin:auto; padding:26px 32px 22px; }
    .top { display:flex; justify-content:space-between; gap:20px; font-size:12px; }
    a { color:inherit; text-underline-offset:4px; }
    .brand { font-weight:800; }
    h1 { margin:22px 0 6px; font-size:24px; letter-spacing:-.6px; }
    p { margin:0; }
    .intro,.note { max-width:88ch; color:#565c59; font-size:13px; }
    .toolbar,.controls { display:flex; align-items:center; flex-wrap:wrap; gap:9px; }
    .toolbar { justify-content:space-between; margin:24px 0 16px; }
    .options { display:flex; flex-wrap:wrap; gap:7px; }
    button { cursor:pointer; font:600 12px Montserrat,Arial,sans-serif; min-height:44px; padding:10px 15px; border-radius:8px; border:1px solid #bfc4c1; color:#080808; background:transparent; }
    .options button[aria-pressed=true] { color:#fff; background:#080808; border-color:#080808; }
    .sizes button[aria-pressed=true] { background:#fff; }
    #replay { background:#ffbf00; border-color:#ffbf00; }
    :focus-visible { outline:3px solid #946900; outline-offset:4px; }
    .controls { margin-top:18px; }
    label { display:flex; align-items:center; gap:7px; min-height:44px; font-size:12px; cursor:pointer; }
    input { width:17px; height:17px; accent-color:#080808; }
    #status { color:#565c59; font-size:12px; margin-left:auto; }
    main { max-width:1360px; padding:0 32px 32px; margin:auto; }
    .frame { width:100%; margin:auto; background:#080808; }
    body.mobile .frame { max-width:390px; }
    iframe { display:block; width:100%; height:500px; border:0; }
    .footnote { text-align:center; margin-top:16px; font-size:12px; color:#565c59; }
    @media(max-width:600px) {
      .review { padding:20px 16px; }
      main { padding:0 12px 24px; }
      h1 { font-size:22px; }
      .options { width:100%; display:grid; grid-template-columns:1fr; }
      .options button { text-align:left; }
      .sizes { display:none; }
      #status { width:100%; margin:0; }
    }
  </style>
</head>
<body>
  <header class="review">
    <div class="top"><a class="brand" href="../index.html#approach">MVMNT CULTR</a><a href="../index.html#approach">Current homepage</a></div>
    <h1>Three ways to bring the heading to life</h1>
    <p class="intro">Compare each animation on the approved open-columns section. Each plays once, then settles into the yellow heading.</p>
    <div class="toolbar">
      <nav class="options" aria-label="Heading animations">
        <button type="button" data-mode="reveal" aria-pressed="true">1. Staggered word reveal</button>
        <button type="button" data-mode="roll" aria-pressed="false">2. Vertical text roll</button>
        <button type="button" data-mode="sweep" aria-pressed="false">3. Gold light sweep</button>
      </nav>
      <div class="sizes" aria-label="Preview width">
        <button type="button" data-size="desktop" aria-pressed="true">Desktop</button>
        <button type="button" data-size="mobile" aria-pressed="false">Mobile</button>
      </div>
    </div>
    <p class="note" id="note"></p>
    <div class="controls">
      <button type="button" id="replay">Replay animation</button>
      <label><input type="checkbox" id="slow">Slow motion</label>
      <label><input type="checkbox" id="reduced">Preview reduced motion</label>
      <span id="status" role="status">Loading preview</span>
    </div>
  </header>
  <main>
    <div class="frame"><iframe src="method-motion-scene.html" title="Animated MVMNT CULTR method section"></iframe></div>
    <p class="footnote">On the homepage, the chosen animation would play when this section first enters view.</p>
  </main>
  <script>
    const descriptions = {
      reveal:'Recommended: words rise into place in a quick, controlled sequence. Clean, athletic, and easy to read. About 1.1 seconds.',
      roll:'Letters roll down into place with a subtle 3D turn. More expressive, with a sports-title feel. About 1.2 seconds.',
      sweep:'A soft highlight travels across the yellow letters. The heading stays readable throughout. About 1.5 seconds.'
    };
    let mode = Object.hasOwn(descriptions,location.hash.slice(1)) ? location.hash.slice(1) : 'reveal';
    const frame = document.querySelector('iframe');
    const reduced = document.querySelector('#reduced');
    const slow = document.querySelector('#slow');
    function play() {
      document.querySelectorAll('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));
      document.querySelector('#note').textContent=descriptions[mode];
      frame.contentWindow.postMessage({type:'method-motion-preview',mode,reduced:reduced.checked,slow:slow.checked},'*');
    }
    document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{
      mode=button.dataset.mode;
      history.replaceState(null,'',`#${mode}`);
      play();
    }));
    document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{
      document.body.classList.toggle('mobile',button.dataset.size==='mobile');
      document.querySelectorAll('[data-size]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
      requestAnimationFrame(play);
    }));
    document.querySelector('#replay').addEventListener('click',play);
    reduced.addEventListener('change',play);
    slow.addEventListener('change',play);
    frame.addEventListener('load',play);
    addEventListener('hashchange',()=>{if(Object.hasOwn(descriptions,location.hash.slice(1))){mode=location.hash.slice(1);play();}});
    addEventListener('message',event=>{
      if(event.source!==frame.contentWindow || event.data?.type!=='method-motion-status') return;
      document.querySelector('#status').textContent=event.data.status;
      if(Number.isFinite(event.data.height)) frame.style.height=`${Math.max(300,event.data.height)}px`;
    });
    document.querySelector('#note').textContent=descriptions[mode];
  </script>
</body>
</html>
