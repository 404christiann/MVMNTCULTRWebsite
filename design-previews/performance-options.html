<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Performance insight · Three design directions</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e9e5;color:#17191a;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:25px 32px;background:#fff;border-bottom:1px solid #dcded8}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:18px;margin:0}a{color:inherit;text-underline-offset:4px;font-size:12px}.controls{display:flex;justify-content:space-between;gap:20px;margin-top:23px;flex-wrap:wrap}.group{display:flex;gap:6px;flex-wrap:wrap}button{font-size:13px;font-weight:600;line-height:1.4;font-family:inherit;padding:11px 17px;border:1px solid #d9dcd4;background:#fff;border-radius:8px;cursor:pointer;color:#252923;min-height:44px}button[aria-pressed=true]{background:#17191a;color:#fff;border-color:#17191a}button:focus-visible,a:focus-visible{outline:3px solid #997500;outline-offset:3px}#note{max-width:920px;color:#60645b;font-size:13px;margin:16px 0 0;min-height:22px}.stage{padding:28px 24px 50px}.frame-wrap{margin:auto;max-width:1240px;background:#f8f7f2;box-shadow:0 14px 50px #0000000b;border:1px solid #d5d8cf;border-radius:12px;overflow:hidden}.frame-wrap.mobile{max-width:390px;border-radius:25px}iframe{display:block;border:0;width:100%;height:850px;background:#f8f7f2}.caption{text-align:center;font-size:11px;color:#696e61;margin:15px 0 0}@media(max-width:650px){header{padding:20px}.top{align-items:start}h1{font-size:16px;max-width:210px}.top a{font-size:11px;white-space:nowrap}.controls{margin-top:18px;gap:12px}.group button{font-size:12px;padding:10px 12px}.stage{padding:20px 10px 35px}.frame-wrap{border-radius:8px}#note{font-size:12px}.devices{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="top"><h1>Performance insight · Design options</h1><a href="../#consulting-title">Back to homepage</a></div><div class="controls"><div class="group" aria-label="Design direction"><button data-design="split" aria-pressed="true">1. Clear split</button><button data-design="portrait" aria-pressed="false">2. Personal connection</button><button data-design="compact" aria-pressed="false">3. Compact accordion</button></div><div class="group devices" aria-label="Preview size"><button data-size="desktop" aria-pressed="true">Desktop</button><button data-size="mobile" aria-pressed="false">Mobile</button></div></div><p id="note" aria-live="polite"></p></header>
<main class="stage"><div class="frame-wrap" id="frame-wrap"><iframe id="preview" title="Responsive performance insight design" src="performance-scene.html#split"></iframe></div><p class="caption">Local design preview · Switch between desktop and mobile above</p></main>
<script>
const notes={split:'Recommended for clarity. A spacious headline beside two levels of support. On mobile, the headline leads into a single stacked panel; everything is visible at a glance.',portrait:'A warmer, more personal direction. Dr. Simi’s portrait anchors the desktop layout. On mobile, the headline and member benefit come first, followed by the photo and ongoing support.',compact:'The lightest, most compact option. Gold highlights the benefit for every member. Movement-plan support stays visible, with second-opinion details available on tap.'};
const frame=document.querySelector('#preview'),wrap=document.querySelector('#frame-wrap');
function choose(id){if(!notes[id])id='split';document.querySelectorAll('[data-design]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.design===id)));document.querySelector('#note').textContent=notes[id];frame.src='performance-scene.html#'+id;history.replaceState(null,'','#'+id)}
document.querySelectorAll('[data-design]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.design)));
document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));wrap.classList.toggle('mobile',b.dataset.size==='mobile')}));
addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data.type==='performance-preview-height'&&Number.isFinite(e.data.height))frame.style.height=Math.max(300,e.data.height)+'px'});
choose(location.hash.slice(1));
</script></body></html>
